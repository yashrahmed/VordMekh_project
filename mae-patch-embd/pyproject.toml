[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mae-patch-embd"
version = "0.1.0"
description = "Masked-autoencoder patch embeddings (ViT-style MAE on MNIST)."
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "torchvision>=0.17"]

[tool.setuptools]
packages = ["mae_patch_embd"]

[dependency-groups]
dev = ["pytest>=8"]
