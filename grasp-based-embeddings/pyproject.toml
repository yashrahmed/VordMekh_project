[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-based-embeddings"
version = "0.1.0"
description = "Local 2D shape descriptors from a five-finger 'feeling hand'."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "torch>=2.2",
]

[tool.setuptools]
packages = ["grasp_embeddings"]

[dependency-groups]
dev = ["pytest>=8"]
