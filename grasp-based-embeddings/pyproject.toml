[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-based-embeddings"
version = "0.1.0"
description = "Self-supervised patch encoders (MAE / I-JEPA) for MNIST."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "torch>=2.2",
    "torchvision>=0.17",
]

[tool.setuptools]
packages = ["grasp_embeddings", "grasp_embeddings.mae_patch_embd"]

[dependency-groups]
dev = ["pytest>=8"]
