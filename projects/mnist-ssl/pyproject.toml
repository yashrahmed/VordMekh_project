[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-ssl"
version = "0.1.0"
description = "From-scratch self-supervised vision models and frozen evaluations on MNIST."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "torch>=2.2",
    "torchvision>=0.17",
    "xgboost>=2.1,<3",
    "scikit-learn>=1.5,<1.7",
]

[tool.setuptools]
packages = ["trials", "ijepa_trials"]

[dependency-groups]
dev = ["pytest>=8"]
