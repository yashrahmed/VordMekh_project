[project]
name = "local-secrets-store"
version = "0.1.0"
description = "A small, local-only encrypted secrets vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0.0,<46",
]

[project.scripts]
local-secrets-store = "local_secrets_store.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_secrets_store"]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
