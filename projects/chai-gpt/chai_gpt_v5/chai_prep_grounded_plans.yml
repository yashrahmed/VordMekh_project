Masala Chai:
  home_preparation:
    scene: home
    description: Chai preparation at home; Pot has no handle and cannot be handled with bare hands;
    steps:
      - Locate(Ginger Root)
      - Locate(Peeler)
      - Peel(Ginger Root, Peeler)
      - Locate(Grater)
      - Grate(Ginger Root, Grater)
      - Discard(Ginger Root Remnant, TrashContainer)
      - Locate(Teaspoon)
      - Measure(Grated Ginger, 0.5, tsp, Teaspoon)
      - Locate(Cardamom Pods)
      - Locate(Cloves)
      - Locate(Peppercorns)
      - Locate(Fennel Seeds)
      - Locate(Mortar)
      - Locate(Pestle)
      - Crush([Cardamom Pods, Cloves, Peppercorns, Fennel Seeds], Mortar and Pestle)
      - Locate(Pot)
      - Locate(Stove)
      - Move(Pot, Stove)
      - TurnOn(Stove)
      - SetHeat(Stove, High)
      - Locate(Measuring Cup)
      - Locate(Water)
      - Measure(Water, 0.75, cup, Measuring Cup)
      - Transfer(Water, Measuring Cup, Pot)
      - Transfer(Grated Ginger, Teaspoon, Pot)
      - Transfer(Crushed Spices, Mortar, Pot)
      - Locate(Ground Cinnamon)
      - Measure(Ground Cinnamon, 0.25, tsp, Teaspoon)
      - Transfer(Ground Cinnamon, Teaspoon, Pot)
      - Locate(Spoon)
      - Stir(Pot, Spoon)
      - WaitUntil(Boiling)
      - SetHeat(Stove, Low)
      - WaitUntil(TimeElapsed(5m))
      - Locate(Loose Black Tea)
      - Measure(Loose Black Tea, 1, tsp, Teaspoon)
      - Transfer(Loose Black Tea, Teaspoon, Pot)
      - Stir(Pot, Spoon)
      - WaitUntil(TimeElapsed(2m))
      - Locate(Whole Milk)
      - Measure(Whole Milk, 0.5, cup, Measuring Cup)
      - Transfer(Whole Milk, Measuring Cup, Pot)
      - SetHeat(Stove, Medium)
      - WaitUntil(JustBeforeBoiling)
      - TurnOff(Stove)
      - Locate(Mitts)
      - Hold(Pot, Mitts)
      - Move(Pot, Countertop)
      - Locate(Strainer)
      - Locate(Cup)
      - Strain(Pot, Strainer, Cup)
      - Locate(Jaggery)
      - Locate(Jaggery Container)
      - Measure(Jaggery, 1, tsp, Teaspoon)
      - Transfer(Jaggery, Teaspoon, Cup)
      - Stir(Cup, Spoon)
      - WaitUntil(SweetenerDissolved)
      - Locate(TrashContainer)
      - Discard(Residues In Strainer, TrashContainer)
