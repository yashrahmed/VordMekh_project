<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chai gpt [tool search edition] v7</title>
    <style>
      :root {
        --bg: radial-gradient(1200px 600px at 10% -20%, #e9d5ff 0, transparent 50%),
              radial-gradient(1000px 600px at 110% 0%, #c7d2fe 0, transparent 50%),
              #0b1020;
        --text: #0f172a;
        --muted: #475569;
        --surface: #ffffff;
        --border: #e5e7eb;
        --ring: #a78bfa;
        --primary: #7c3aed;
        --primary-900: #5b21b6;
        --shadow: 0 10px 25px rgba(2, 6, 23, 0.12), 0 4px 10px rgba(2, 6, 23, 0.06);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: radial-gradient(1200px 600px at 10% -20%, rgba(124, 58, 237, 0.25) 0, transparent 50%),
                radial-gradient(1000px 600px at 110% 0%, rgba(59, 130, 246, 0.25) 0, transparent 50%),
                #0b1020;
          --text: #e5e7eb;
          --muted: #94a3b8;
          --surface: rgba(15, 23, 42, 0.6);
          --border: rgba(148, 163, 184, 0.25);
          --ring: #a78bfa;
          --primary: #a78bfa;
          --primary-900: #7c3aed;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }
      }

      html, body { height: 100%; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
        margin: 0;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.2px;
        margin: 0;
      }
      .subtle {
        color: var(--muted);
        font-size: 13px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: saturate(140%) blur(6px);
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 14px;
      }

      .controls label {
        font-weight: 500;
      }

      .query-wrapper {
        position: relative;
        display: grid;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 20px;
        background: color-mix(in oklab, var(--surface) 94%, rgba(15, 23, 42, 0.12));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      .query-wrapper:focus-within {
        border-color: var(--ring);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 0 0 4px color-mix(in oklab, var(--ring) 25%, transparent);
      }

      .query-wrapper textarea {
        grid-area: 1 / 1;
        width: 100%;
        box-sizing: border-box;
        min-height: 130px;
        padding: 12px 124px 40px 12px;
        border: none;
        outline: none;
        resize: vertical;
        font-size: 14px;
        line-height: 1.55;
        color: var(--text);
        background: transparent;
        font-family: inherit;
      }
      .query-wrapper textarea:disabled {
        cursor: not-allowed;
        color: color-mix(in oklab, var(--muted) 70%, var(--text) 30%);
      }

      .query-wrapper button {
        grid-area: 1 / 1;
        justify-self: end;
        align-self: end;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        color: white;
        background: linear-gradient(135deg, var(--primary), var(--primary-900));
        box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
        transition: transform 80ms ease, box-shadow 120ms ease, opacity 120ms ease;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(124, 58, 237, 0.4);
      }
      button:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        filter: grayscale(10%);
      }

      .status {
        font-size: 13px;
        color: var(--muted);
        min-height: 1em;
        margin: 4px 0 0;
      }

      .section-title {
        margin: 16px 0 8px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      .recipe {
        margin-top: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: saturate(140%) blur(6px);
        position: relative;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text);
      }
      .recipe h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .recipe .rich-text h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 18px 0 8px;
      }
      .recipe .rich-text p,
      .recipe .rich-text li,
      .recipe .rich-text span {
        margin: 0 0 8px;
      }
      .recipe .rich-text ul,
      .recipe .rich-text ol {
        margin: 0 0 8px 18px;
        padding: 0;
      }
      pre {
        white-space: pre-wrap;
        background: color-mix(in oklab, var(--surface) 60%, #000 5%);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        overflow-x: auto;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.6;
      }

      /* Scene buttons inside recipe block */
      .scene-buttons {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: flex-end; /* move buttons to the right */
        margin-top: 12px;
      }
      .btn-small {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 10px;
      }
      .tips {
        margin-top: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: saturate(140%) blur(6px);
        font-size: 14px;
        line-height: 1.6;
        color: var(--text);
      }
      .tips h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .tips p,
      .tips li,
      .tips span {
        margin: 0 0 8px;
      }
      .tips ul,
      .tips ol {
        margin: 0 0 8px 18px;
        padding: 0;
      }

      /* Spinner for tips section */
      .spinner-row {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid color-mix(in oklab, var(--ring) 30%, transparent);
        border-top-color: var(--ring);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Chai GPT v7 [Tool Search edition]</h1>
        <span class="subtle">chai gpt v7 [tool search edition]</span>
      </div>

      <div class="panel">
        <div class="controls">
          <label for="chaiQuery" class="subtle">Search for a chai recipe.</label>
          <div class="query-wrapper">
            <textarea
              id="chaiQuery"
              aria-label="Search for a chai recipe."
              placeholder="Describe the chai recipe you want to brew..."
            ></textarea>
            <button id="getRecipeBtn" type="button" disabled>Get Recipe</button>
          </div>
        </div>

        <div class="status" id="status"></div>
        <div class="section-title">Recipe</div>
        <div id="recipeOutput"></div>

        <div class="section-title">Required tools</div>
        <div id="prepTipsOutput" class="tips"><p class="subtle">N/A</p></div>
      </div>
    </div>

    <script>
      (function () {
        const queryInput = document.getElementById('chaiQuery');
        const getRecipeBtn = document.getElementById('getRecipeBtn');
        const statusEl = document.getElementById('status');
        const output = document.getElementById('recipeOutput');
        const tipsOutput = document.getElementById('prepTipsOutput');

        let hasRenderedRecipe = false;
        let lastRecipeText = '';
        let isRecipeRequestActive = false;
        let btnHomeRef = null;
        let btnCampRef = null;

        function escapeHTML(s) {
          return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function formatPrepTextToHTML(text) {
          const lines = String(text || '').split('\n');
          let html = '';
          let inList = false;
          for (const raw of lines) {
            const line = raw.trim();
            if (line.startsWith('- ')) {
              if (!inList) { html += '<ul>'; inList = true; }
              html += `<li>${escapeHTML(line.slice(2))}</li>`;
            } else {
              if (inList) { html += '</ul>'; inList = false; }
              if (!line) { html += '<br />'; continue; }
              if (/-\s*$/.test(line)) {
                const heading = line.replace(/-\s*$/, '').trim();
                html += `<h3>${escapeHTML(heading)}</h3>`;
              } else {
                html += `<p>${escapeHTML(line)}</p>`;
              }
            }
          }
          if (inList) html += '</ul>';
          return html;
        }

        function resetTips() {
          tipsOutput.innerHTML = '<p class="subtle">N/A</p>';
        }

        function setPlaceholder(customMessage) {
          const wrap = document.createElement('div');
          wrap.className = 'recipe';
          const p = document.createElement('p');
          p.className = 'subtle';
          p.textContent = customMessage || 'Search for a recipe';
          wrap.appendChild(p);
          output.innerHTML = '';
          output.appendChild(wrap);
          hasRenderedRecipe = false;
          lastRecipeText = '';
          btnHomeRef = null;
          btnCampRef = null;
          resetTips();
          if (!customMessage) {
            statusEl.textContent = '';
          }
          updateControlState();
        }

        function updateControlState() {
          const hasQuery = !!queryInput.value.trim();
          queryInput.disabled = isRecipeRequestActive;
          getRecipeBtn.disabled = isRecipeRequestActive || !hasQuery;
        }

        function setBusy(busy, msg) {
          isRecipeRequestActive = !!busy;
          updateControlState();
          if (msg !== undefined) {
            statusEl.textContent = msg;
          }
        }

        function createSceneButtons() {
          const row = document.createElement('div');
          row.className = 'scene-buttons';
          const btnHome = document.createElement('button');
          btnHome.className = 'btn-small';
          btnHome.textContent = 'Prep@Home';
          btnHome.title = 'Required tools: home';
          btnHome.addEventListener('click', (e) => {
            e.preventDefault();
            requestPreparation('home');
          });

          const btnCamp = document.createElement('button');
          btnCamp.className = 'btn-small';
          btnCamp.textContent = 'Prep@Campsite';
          btnCamp.title = 'Required tools: campsite';
          btnCamp.addEventListener('click', (e) => {
            e.preventDefault();
            requestPreparation('campsite');
          });

          row.appendChild(btnHome);
          row.appendChild(btnCamp);
          btnHomeRef = btnHome;
          btnCampRef = btnCamp;
          return row;
        }

        function setSceneButtonsBusy(busy) {
          if (btnHomeRef) btnHomeRef.disabled = !!busy;
          if (btnCampRef) btnCampRef.disabled = !!busy;
        }

        async function requestPreparation(scene) {
          if (!hasRenderedRecipe || !lastRecipeText) return;

          tipsOutput.innerHTML = '<div class="spinner-row"><div class="spinner"></div><span class="subtle">Fetching required tools…</span></div>';
          setSceneButtonsBusy(true);

          const prevBusyState = isRecipeRequestActive;
          isRecipeRequestActive = true;
          updateControlState();

          try {
            const res = await fetch('/get-prep-tools', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json, text/plain;q=0.8, */*;q=0.5'
              },
              body: JSON.stringify({
                scene_type: scene,
                recipe_text: lastRecipeText,
              }),
            });
            const text = await res.text();
            if (!res.ok) {
              let message = res.statusText || 'Request failed';
              try {
                const jsonErr = JSON.parse(text);
                message = jsonErr.error || message;
              } catch (_) {
                if (text) message = text;
              }
              throw new Error(message);
            }

            let content = text;
            try {
              const json = JSON.parse(text);
              content = json.sanitized_text || json.recipe || text;
            } catch (_) {
              // Keep original text if parsing fails
            }

            const html = formatPrepTextToHTML(content);
            tipsOutput.innerHTML = html || '<p class="subtle">N/A</p>';
          } catch (err) {
            tipsOutput.innerHTML = `<pre>${(err && err.message) ? err.message : String(err)}</pre>`;
          } finally {
            setSceneButtonsBusy(false);
            isRecipeRequestActive = prevBusyState;
            updateControlState();
          }
        }

        function renderRecipeText(text) {
          const rawText = typeof text === 'string' ? text : '';
          const recipeContent = rawText.trim();
          output.innerHTML = '';
          const container = document.createElement('div');
          container.className = 'recipe';

          if (recipeContent) {
            const content = document.createElement('div');
            content.className = 'rich-text';
            const html = formatPrepTextToHTML(rawText);
            content.innerHTML = html || `<p>${escapeHTML(recipeContent)}</p>`;
            container.appendChild(content);
            btnHomeRef = null;
            btnCampRef = null;
            container.appendChild(createSceneButtons());
            hasRenderedRecipe = true;
            lastRecipeText = rawText;
          } else {
            const p = document.createElement('p');
            p.className = 'subtle';
            p.textContent = 'Recipe content was empty.';
            container.appendChild(p);
            hasRenderedRecipe = false;
            lastRecipeText = '';
            btnHomeRef = null;
            btnCampRef = null;
          }

          output.appendChild(container);
          resetTips();
          setSceneButtonsBusy(false);
        }

        async function fetchRecipe() {
          const query = queryInput.value.trim();
          if (!query) {
            setPlaceholder();
            return;
          }

          hasRenderedRecipe = false;
          lastRecipeText = '';
          btnHomeRef = null;
          btnCampRef = null;
          resetTips();
          output.innerHTML = '';

          setBusy(true, 'Searching…');

          try {
            const res = await fetch('/get-recipe', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json, text/plain;q=0.8, */*;q=0.5'
              },
              body: JSON.stringify({ query }),
            });

            const text = await res.text();
            let data = null;
            try {
              data = JSON.parse(text);
            } catch (_) {
              // Leave as plain text if not JSON
            }

            if (!res.ok) {
              const message = (data && data.error) ? data.error : (text || res.statusText);
              throw new Error(message);
            }

            const recipeText = data && typeof data.recipe === 'string' ? data.recipe : text;
            renderRecipeText(recipeText);
            statusEl.textContent = '';
          } catch (err) {
            const wrap = document.createElement('div');
            wrap.className = 'recipe';
            const pre = document.createElement('pre');
            pre.textContent = (err && err.message) ? err.message : String(err);
            wrap.appendChild(pre);
            output.innerHTML = '';
            output.appendChild(wrap);
            statusEl.textContent = 'Failed to fetch recipe';
            hasRenderedRecipe = false;
            lastRecipeText = '';
            btnHomeRef = null;
            btnCampRef = null;
            resetTips();
          } finally {
            setBusy(false);
          }
        }

        function handleQueryChange() {
          updateControlState();
          if (!queryInput.value.trim()) {
            setPlaceholder();
          }
        }

        queryInput.addEventListener('input', handleQueryChange);
        queryInput.addEventListener('paste', () => {
          requestAnimationFrame(handleQueryChange);
        });

        getRecipeBtn.addEventListener('click', (e) => {
          e.preventDefault();
          fetchRecipe();
        });

        setPlaceholder();
      })();
    </script>
  </body>
  </html>
