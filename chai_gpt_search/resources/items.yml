- key: tourne_knife
  name: "Tourné knife"
  description: >-
    Tournée is the French word for "turned." It refers to a special vegetable cut
    that results in a 7-sided oblong shape. Some consider it a type of paring knife.
  actions:
    - peel_round_produce
    - extract_stem_core
    - remove_surface_blemish
    - sculpt_decorative_shape

- key: paring_knife
  name: Paring knife
  description: >-
    A small, short-bladed knife (usually 3-4 inches) with a straight or slightly
    convex edge. It is the most versatile tool for precision tasks requiring
    control, usable both in the hand and on a cutting board.
  actions:
    - peel_round_produce
    - peel_irregular_produce
    - extract_stem_core
    - slice_small_produce
    - mince_small_aromatics
    - trim_meat_fat
    - pierce_check_texture
    - sever_binding_material

- key: slicer_knife
  name: Slicer knife
  description: >-
    Long blade with a round or pointed tip; the blade may be flexible or rigid,
    tapered or round, or have a fluted edge.
  actions:
    - carve_cooked_protein
    - slice_cured_fish
    - slice_uniform_portions
    - portion_boneless_meat

- key: boning_knife
  name: Boning knife
  description: >-
    Blade is thinner than that of a chef's knife, about 6 inches long, and rigid.
    It is used for separating raw meat from the bone.
  actions:
    - debone_raw_protein
    - disjoint_carcass
    - trim_connective_tissue
    - extract_buried_bone
    - butterfly_thick_protein

- key: mandoline
  name: Mandoline slicer
  description: >-
    Features blades of high-carbon steel. Levers adjust blades to achieve the cut
    and thickness desired. A guard provides safety. Used for slicing, julienning,
    and cutting gaufrettes and batonnets.
  actions:
    - slice_uniform_produce
    - julienne_vegetables
    - cut_french_fries
    - cut_waffle_pattern
    - shave_delicate_produce

- key: sauce_whisk
  name: Sauce whisk
  description: >-
    Unlike balloon whisks which are sphere-shaped to incorporate air, sauce whisks
    are flatter, narrower, and frequently have thick wires to reach the corners of
    a pan.
  actions:
    - emulsify_liquid_fat
    - smooth_heavy_sauce
    - access_pan_corners
    - dissolve_starch_thickener

- key: cleaver
  name: Cleaver
  description: >-
    A heavy knife used to cut through bones. Cleavers typically have a rectangular
    blade.
  actions:
    - chop_through_bone
    - crush_aromatics
    - tenderize_meat

- key: utility_knife
  name: Utility knife
  description: >-
    Smaller and lighter than a chef's knife, used for various mid-sized cutting
    chores.
  actions:
    - slice_midsize_produce
    - trim_meat_fat
    - portion_sandwich_cheese
    - segment_citrus

- key: chef_knife
  name: "Chef's/French knives"
  description: >-
    Has blades 8-12 inches long. An all-purpose utility knife for a variety of
    chopping, mincing, and slicing chores.
  actions:
    - rock_chop_herbs
    - push_cut_vegetables
    - slice_large_produce
    - crush_garlic_clove

- key: balloon_whisk
  name: Balloon whisks
  description: >-
    Are balloon-shaped and have thin wires. They are used for beating, blending,
    and whipping to incorporate air.
  actions:
    - beat_eggs
    - blend_batter
    - whip_cream_whites

- key: peelers
  name: Peelers
  description: >-
    Tools used for peeling vegetables and fruits. The blade may be mounted
    horizontally or vertically.
  actions:
    - peel_produce_skin
    - shave_hard_cheese
    - shave_vegetable_ribbons

- key: rolling_pin
  name: Rolling pins
  description: >-
    A cylindrical utensil used to shape and flatten dough. Two styles are found:
    rollers and rods.
  actions:
    - roll_dough_flat
    - crush_crumbs_nuts
    - shape_pastry

- key: stockpot_marmite
  name: Stockpot/Marmite
  description: >-
    A large, deep pot that is used to prepare soups or simmer liquids. They are
    meant to handle large quantities of liquid. It is taller than it is wide.
  actions:
    - simmer_stock
    - boil_large_volume
    - stew_meat_vegetables

- key: sauce_pot
  name: Sauce pot
  description: >-
    Tall, but not as tall as a stockpot. They are used for simmering and reducing
    sauces. The wider base helps the liquid heat evenly.
  actions:
    - reduce_sauce_liquid
    - simmer_grains
    - blanch_vegetables

- key: sauce_pan
  name: Sauce pan
  description: >-
    Narrower than a sauce pot but typically just as tall. They have a long handle
    on one side.
  actions:
    - heat_small_liquid
    - boil_eggs
    - poach_eggs

- key: saute_pan
  name: Sauteuses/Saute pan
  description: >-
    Shallow skillet with sloping sides and a long handle.
  actions:
    - saute_vegetables
    - sear_protein
    - flip_contents_motion

- key: fish_poacher
  name: Fish poacher
  description: >-
    A long, narrow lidded pot with straight sides that includes a perforated rack
    for holding fish.
  actions:
    - poach_whole_fish
    - steam_delicate_items

- key: measuring_spoons
  name: Measuring spoons
  description: >-
    Essential kitchen tools used to determine the amount of an ingredient needed
    for a recipe. Ideal for small amounts.
  actions:
    - measure_spices
    - scoop_dry_ingredients

- key: measuring_pitcher
  name: Measuring pitcher
  description: >-
    A utensil used to measure liquid and sometimes dry ingredients accurately. It
    usually features graduated markings.
  actions:
    - measure_liquid_volume
    - pour_controlled_stream

- key: probe_thermometer
  name: Probe thermometer
  description: >-
    A device used to measure the internal temperature of food while it cooks,
    allowing for accurate monitoring without opening the oven or grill.
  actions:
    - measure_internal_temp
    - monitor_cooking_progress

- key: colander
  name: Colander
  description: >-
    A perforated kitchen utensil used to strain foods such as pasta or to rinse
    vegetables.
  actions:
    - drain_pasta_water
    - rinse_produce
    - strain_large_solids

- key: ricer
  name: Ricer
  description: >-
    A kitchen implement used to process potatoes or other food by forcing it
    through a sheet of small holes.
  actions:
    - rice_cooked_potatoes
    - press_soft_vegetables
    - create_smooth_puree

- key: chinois
  name: Chinois/Conical Sieve
  description: >-
    Also known as a bouillon strainer, it is a conical sieve with an extremely
    fine mesh. Used to strain custards, purees, soups, and sauces.
  actions:
    - strain_fine_sauce
    - filter_impurities
    - dust_powdered_sugar

- key: roasting_pan
  name: Roasting pan
  description: >-
    Used for roasting or baking. It is a rectangular pan with medium-high sides.
  actions:
    - roast_large_poultry
    - roast_vegetables
    - catch_drippings

- key: loaf_pan
  name: Loaf pan
  description: >-
    Rectangular deep pan with straight or flared sides. It is used for baking
    breads and meatloaves.
  actions:
    - bake_bread_loaf
    - mold_meatloaf
    - bake_pound_cake

- key: ramekin
  name: Ramekin
  description: >-
    A round, straight-sided ceramic dish. Used for molding while baking soufflés
    etc.
  actions:
    - bake_individual_portion
    - mold_souffle
    - serve_condiments

- key: blender
  name: Blender
  description: >-
    Used for pureeing, liquefying, and emulsifying foods. It consists of a base
    that houses the motor and a removable lidded jar.
  actions:
    - puree_soup
    - crush_ice
    - emulsify_dressing
    - liquefy_fruit

- key: stand_mixer
  name: Stand mixer
  description: >-
    Used for mixing, beating, whipping, and kneading. It is an electrical machine
    with detachable bowls and supports various attachments.
  actions:
    - knead_bread_dough
    - whip_heavy_cream
    - mix_cake_batter
    - cream_butter_sugar
