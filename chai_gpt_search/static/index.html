<html>
    <body>
    <div id="app"></div>
    <div id="app2"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type = "text/jsx">
       
        function ListOfNames() {
            const names = ['Ada Lovelace', 'Grace Hopper', 'Margaret Hamilton'];

            // Hooks and their handlers must be defined within the component.
            const [likes, setLikes] = React.useState(0);

            function likeClickHandler() {
                setLikes(likes + 1);
            }

            return <div>
                <ul>
                    {
                        names.map((name) => (
                        <li key={name}>
                            {name} 
                        </li>))
                    }
                </ul>
                <button onClick={likeClickHandler}>Like this article!</button>
                <p>Liked by {likes} people!</p>
            </div>;
        }

        function Header(props) {// all props imported as a dictionary.
            let {title} = props // ES destructuring.
            console.log(title); 
            return <h1>Developer Preview for {title}!</h1>;
        }

        function HomePage() {
            return <div>
                <Header title="React Tutorial"/>
                <p>Here is some content</p>
                <ListOfNames/>
            </div>;
        }

        const root1 = ReactDOM.createRoot(document.getElementById('app'));
        root1.render(<HomePage/>);
    </script>
    </body>
</html>
