chai_recipes:
  Masala Chai:
    ingr:
      - ["Water", 0.75, "cup"]
      - ["Whole Milk", 0.5, "cup"]
      - ["Loose Black Tea", 1, "tsp"]
      - ["Grated Fresh Ginger", 0.5, "tsp"]
      - ["Ground Cinnamon", 0.25, "tsp"]
      - ["Green Cardamom Pods", 3, "pods"]
      - ["Whole Cloves", 2, "cloves"]
      - ["Black Peppercorns", 2, "peppercorns"]
      - ["Fennel Seeds", 0.25, "tsp"]
      - ["Jaggery or Sugar", 1, "tsp"]
    tools:
      - ["Medium Pot", 1, null]
      - ["Mortar and Pestle", 1, null]
      - ["Strainer", 1, null]
    steps:
      - "Using a mortar and pestle, lightly crush cardamom, cloves, peppercorns, and fennel seeds."
      - "Add crushed spices, ginger, and cinnamon to a pot with 0.75 cups of Water. Boil, then simmer covered for 5-6 min."
      - "Add 1 tsp of loose tea and simmer for another 2-3 min."
      - "Pour in 0.5 cups of milk and heat until just before boiling."
      - "Strain into a cup and stir in sweetener."
  Adrak Chai:
    ingr:
      - ["Water", 0.75, "cup"]
      - ["Whole Milk", 0.5, "cup"]
      - ["Loose Black Tea", 1.5, "tsp"]
      - ["Grated Fresh Ginger", 3, "tsp"]
      - ["Jaggery or Sugar", 1, "tsp"]
    tools:
      - ["Small Saucean", 1, null]
      - ["Mortar and Pestle", 1, null]
      - ["Strainer", 1, null]
    steps:
      - "Combine 0.75 cups of Water and 3 tsp of ginger in a saucepan. Boil and simmer for 3-5 min."
      - "Add 1.5 tsp of tea leaves and simmer for 2-3 min."
      - "Pour in 0.5 cups of Milk and bring to a final, gentle boil."
      - "Strain into a cup and sweeten to taste."
  Sulaimani Chai:
    ingr:
      - ["Water", 1, "cup"]
      - ["Loose Black Tea", 1, "tsp"]
      - ["Whole Cloves", 2, "cloves"]
      - ["Green Cardamom Pods", 1, "pods"]
      - ["Saffron Threads", 5, "threads"]
      - ["Lemon Juice", 1, "tsp"]
      - ["Fresh Mint Leaves", 3, "leaves"]
      - ["Honey or Jaggery", 1, "tsp"]
    tools:
      - ["Small Pot", 1, null]
      - ["Strainer", 1, null]
    steps:
      - "Boil 1 cup of Water with 2 crushed cloves, 1 crushed cardamom, and 5 saffron threads. Simmer 2 min."
      - "Remove from heat, add 1 tsp of tea leaves, and steep for 2-3 min. Do not boil tea leaves."
      - "Strain. Stir in lemon juice, mint, and sweetener."
  Kashmiri Chai:
    ingr:
      - ["Water", 1.5, "cup"]
      - ["Ice", 0.5, "cup"]
      - ["Kashmiri Green Tea Leaves", 1, "tsp"]
      - ["Baking Soda", 0.125, "tsp"]
      - ["Whole Milk", 0.75, "cup"]
      - ["Salt", 0.5, "tsp"]
      - ["Green Cardamom Pods", 1, "pods"]
      - ["Crushed Nuts", 0.5, "tbsp"]
    tools:
      - ["Medium Pot", 1, null]
      - ["Whisk or Deep Ladle", 1, null]
      - ["Strainer", 1, null]
    steps:
      - "Boil 1.5 cups Water, 1 tsp tea, and 1/8 tsp baking soda. Simmer 15-25 min until liquid reduces by half."
      - "Add 0.5 cups of Ice/Water. Whisk or aerate vigorously until frothy."
      - "Stir in 0.75 cups milk and 1 crushed cardamom. Gently simmer (do not boil) for 5-10 min until pink."
      - "Season with salt, strain, and garnish."
  Kahwah:
    ingr:
      - ["Water", 1, "cup"]
      - ["Green Tea Leaves", 0.5, "tsp"]
      - ["Green Cardamom Pods", 1, "pods"]
      - ["Ground Cinnamon", 0.125, "tsp"]
      - ["Saffron Threads", 5, "threads"]
      - ["Dried Rose Petals", 0.5, "tsp"]
      - ["Slivered Almonds", 0.5, "tbsp"]
      - ["Honey or Sugar", 1, "tsp"]
    tools:
      - ["Pot", 1, null]
      - ["Strainer", 1, null]
    steps:
      - "Boil 1 cup Water with 1 crushed cardamom, 1/8 tsp cinnamon, 5 saffron threads, and rose petals. Simmer 5 min."
      - "Turn off heat. Add 0.5 tsp green tea, cover, and steep for 2-3 min."
      - "Strain into a cup. Sweeten and garnish with almonds."
